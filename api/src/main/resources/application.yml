server:
  port: 8080

spring:
  application:
    name: aw-central-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aw}
    username: ${DB_USER:aw}
    password: ${DB_PASSWORD:aw}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ingest:
  max-batch-size: 5000
  skew-warn-seconds: 120

logging:
  level:
    dev.omarsolarte.awcentral: INFO
